name: Publish release candidate

# Reusable workflow: publishes the current state of a release or hotfix branch
# as a release candidate. It only runs on request, from the manual button.
#
#   1. Creates the tag "vX.Y.Z-rc.N", N being the next free number.
#   2. Builds the Docker images tagged "X.Y.Z-rc.N" ("latest" is not moved).

on:
  workflow_call:
    inputs:
      release-branch:
        description: Branch to publish, for example "release-v1.5.0" or "hotfix/v1.5.1".
        type: string
        required: true
      docker-images:
        description: JSON list of the images to build, see build-docker-images.yml.
        type: string
        default: '[{"context": "."}]'

permissions:
  contents: write
  packages: write

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release-candidate.outputs.version }}

    steps:
      # Every tag is needed to count the release candidates already published.
      - name: Checkout the branch to publish
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-branch }}
          fetch-depth: 0

      - name: Create the next release candidate tag
        id: release-candidate
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          # The branch name has already been validated by check-gitflow-branches.yml.
          # Keeps what follows the "v": "release-v1.5.0" and "hotfix/v1.5.1" give "1.5.0" and "1.5.1".
          version="${RELEASE_BRANCH##*v}"

          published_release_candidate_count=$(git tag --list "v${version}-rc.*" | wc -l)
          release_candidate_version="${version}-rc.$((published_release_candidate_count + 1))"

          git tag "v${release_candidate_version}"
          git push origin "v${release_candidate_version}"

          echo "version=${release_candidate_version}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Release candidate::Tag v${release_candidate_version} créé sur ${RELEASE_BRANCH}."

  docker:
    name: Docker
    needs: tag
    uses: ./.github/workflows/build-docker-images.yml
    secrets: inherit
    with:
      # The tag is built rather than the branch, so the image matches the tag exactly.
      git-reference: v${{ needs.tag.outputs.version }}
      version: ${{ needs.tag.outputs.version }}
      docker-images: ${{ inputs.docker-images }}
