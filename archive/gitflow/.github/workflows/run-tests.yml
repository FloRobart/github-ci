name: Run tests

# Reusable workflow: installs the project and runs its tests, with the tools
# matching its type. A project without any test passes.

on:
  workflow_call:
    inputs:
      project-type:
        description: Either "nodejs" or "flutter", as given by detect-project-type.yml.
        type: string
        required: true
      node-version:
        description: Node.js version used by Node.js projects.
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      # ---------- Node.js ----------

      - name: Set up Node.js
        if: inputs.project-type == 'nodejs'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          # The npm cache is keyed on package-lock.json: without it, there is nothing to cache.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # "npm ci" is faster and reproducible, but needs package-lock.json.
      - name: Install Node.js dependencies
        if: inputs.project-type == 'nodejs'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            exit 0
          fi

          npm install

      - name: Run Node.js tests
        if: inputs.project-type == 'nodejs'
        env:
          CI: true
        run: npm test --if-present

      # ---------- Flutter ----------

      - name: Set up Flutter
        if: inputs.project-type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        if: inputs.project-type == 'flutter'
        run: flutter pub get

      # "flutter test" fails when the project has no test directory.
      - name: Run Flutter tests
        if: inputs.project-type == 'flutter' && hashFiles('test/**') != ''
        run: flutter test
