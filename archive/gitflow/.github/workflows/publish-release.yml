name: Publish release

# Reusable workflow: publishes the final version once a release or hotfix branch
# has been merged into "main".
#
#   1. Finds the branch that was just merged, and reads the version from its name.
#   2. Creates the tag "vX.Y.Z" and the GitHub Release, with generated release notes.
#   3. Builds the Docker images tagged "X.Y.Z" and "latest".
#   4. Deletes the merged branch, so the next version can be started.
#   5. Opens the pull request that brings "main" back into "dev".
#
# A push on "main" that comes from any other branch publishes nothing.
#
# Every step accepts to run twice, so a failed run can simply be re-run.

on:
  workflow_call:
    inputs:
      docker-images:
        description: JSON list of the images to build, see build-docker-images.yml.
        type: string
        default: '[{"context": "."}]'

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  # Lets the GitHub CLI work without a checkout of the repository.
  GH_REPO: ${{ github.repository }}

jobs:
  find-release:
    name: Find the merged release
    runs-on: ubuntu-latest

    outputs:
      branch: ${{ steps.merged-release.outputs.branch }}
      version: ${{ steps.merged-release.outputs.version }}

    steps:
      - name: Read the version from the merged branch
        id: merged-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same pattern as RELEASE_BRANCH_PATTERN in check-gitflow-branches.yml.
          merged_release_branch=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].head.ref' \
              | grep -E '^(release-|hotfix/)v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 \
              || true
          )

          echo "branch=${merged_release_branch}" >> "${GITHUB_OUTPUT}"

          # Keeps what follows the "v": "release-v1.5.0" and "hotfix/v1.5.1" give "1.5.0" and "1.5.1".
          echo "version=${merged_release_branch##*v}" >> "${GITHUB_OUTPUT}"

          if [ -z "${merged_release_branch}" ]; then
            echo "::warning title=Aucune version publiée::Ce push sur main ne vient ni d'une branche release-vX.Y.Z ni d'une branche hotfix/vX.Y.Z : rien n'est publié."
          fi

  github-release:
    name: GitHub Release
    needs: find-release
    if: needs.find-release.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.find-release.outputs.version }}
        run: |
          # A re-run keeps the release created by the first run.
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "::notice title=Release déjà créée::La release v${VERSION} existe déjà, elle est conservée."
            exit 0
          fi

          # "My_Project" is displayed as "My Project v1.5.0".
          repository_name="${GITHUB_REPOSITORY#*/}"
          release_title="${repository_name//_/ } v${VERSION}"

          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${release_title}" \
            --generate-notes

  docker:
    name: Docker
    needs: [find-release, github-release]
    uses: ./.github/workflows/build-docker-images.yml
    secrets: inherit
    with:
      git-reference: v${{ needs.find-release.outputs.version }}
      version: ${{ needs.find-release.outputs.version }}
      tag-latest: true
      docker-images: ${{ inputs.docker-images }}

  # check-gitflow-branches.yml refuses a new version while this branch exists.
  delete-release-branch:
    name: Delete the merged branch
    needs: [find-release, github-release]
    runs-on: ubuntu-latest

    steps:
      - name: Delete the release or hotfix branch
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_BRANCH: ${{ needs.find-release.outputs.branch }}
        run: |
          # The branch is already gone when "Automatically delete head branches" is checked.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${MERGED_BRANCH}" --silent 2> /dev/null; then
            echo "La branche ${MERGED_BRANCH} est déjà supprimée."
            exit 0
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${MERGED_BRANCH}"
          echo "::notice title=Branche supprimée::${MERGED_BRANCH} est supprimée : une nouvelle version peut être créée."

  back-merge:
    name: Back-merge into dev
    needs: [find-release, github-release]
    runs-on: ubuntu-latest

    steps:
      - name: Open the pull request from main to dev
        env:
          # GITFLOW_TOKEN is optional, see create-release-branch.yml.
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
          VERSION: ${{ needs.find-release.outputs.version }}
        run: |
          open_back_merge_count=$(gh pr list --base dev --head main --state open --json number --jq 'length')

          if [ "${open_back_merge_count}" -gt 0 ]; then
            echo "::notice title=Back-merge déjà ouvert::Une pull request main → dev est déjà ouverte : elle contient aussi la version v${VERSION}."
            exit 0
          fi

          # A re-run after the back-merge was merged finds nothing left to bring back.
          commits_missing_from_dev=$(gh api "repos/${GITHUB_REPOSITORY}/compare/dev...main" --jq '.ahead_by')

          if [ "${commits_missing_from_dev}" -eq 0 ]; then
            echo "::notice title=Back-merge inutile::dev contient déjà tout main."
            exit 0
          fi

          pull_request_body="Ramène dans \`dev\` la version **v${VERSION}** publiée sur \`main\` : numéro de version et correctifs faits sur la branche de release ou de hotfix.

          ⚠️ À merger avec **Create a merge commit** (pas de squash), pour que \`dev\` et \`main\` gardent un historique commun."

          gh pr create \
            --base dev \
            --head main \
            --title "chore(release): back-merge v${VERSION} into dev" \
            --body "${pull_request_body}"
