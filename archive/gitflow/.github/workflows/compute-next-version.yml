name: Compute next version

# Reusable workflow: computes the next version from the titles of the pull
# requests merged since the last published version.
#
#   breaking change ("feat!: ...", "fix(api)!: ...", "BREAKING CHANGE: ...")  →  major
#   new feature ("feat: ...")                                                →  minor
#   anything else ("fix: ...", "chore: ...", "docs: ...")                    →  patch
#
# The last published version is the highest "vX.Y.Z" tag. A project without any
# tag gets 0.1.0 as its first version: its history may predate the gitflow, so its
# messages are not read. To start from another version, create its tag on main.
#
# A hotfix is always a patch: its version is chosen on "main", before any of its
# commits exists, so there is no message to read yet.

on:
  workflow_call:
    inputs:
      hotfix:
        description: True when the version is for a hotfix, which starts without any new commit.
        type: boolean
        default: false
    outputs:
      version:
        description: Next version, without the "v" prefix, for example "1.5.0".
        value: ${{ jobs.compute.outputs.version }}

permissions:
  contents: read

jobs:
  compute:
    name: Compute
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.next-version.outputs.version }}

    steps:
      # The whole history and every tag are needed to find the commits added since the last version.
      - name: Checkout the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the last published version
        id: last-version
        run: |
          # Release candidate tags ("v1.5.0-rc.1") are left out by the strict pattern.
          last_tag=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          echo "tag=${last_tag}" >> "${GITHUB_OUTPUT}"
          echo "Dernière version publiée : ${last_tag:-aucune}"

      - name: Refuse a release that contains nothing new
        if: inputs.hotfix == false && steps.last-version.outputs.tag != ''
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag }}
        run: |
          new_commit_count=$(git rev-list --no-merges --count "${LAST_TAG}..HEAD")

          if [ "${new_commit_count}" -gt 0 ] && ! git diff --quiet "${LAST_TAG}" HEAD; then
            echo "${new_commit_count} commit(s) depuis ${LAST_TAG}."
            exit 0
          fi

          echo "::error title=Rien à publier::Aucun changement depuis ${LAST_TAG}. Mergez au moins une pull request dans dev avant de créer une release."
          exit 1

      - name: Compute the next version
        id: next-version
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag }}
        run: |
          if [ -z "${LAST_TAG}" ]; then
            first_version='0.1.0'
            echo "version=${first_version}" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Version suivante::Aucun tag vX.Y.Z : première version ${first_version}."
            exit 0
          fi

          # "--first-parent" only reads the commits of the branch itself, one per merged
          # pull request, and skips the commits inside each pull request. Subjects and
          # bodies are both read: a squash merge puts the pull request title in the
          # subject, a merge commit puts it in the body.
          commit_messages=$(git log --first-parent --format='%s%n%b' "${LAST_TAG}..HEAD")

          feature_pattern='^feat(\([^()]+\))?: '
          breaking_change_pattern='^([a-z]+(\([^()]+\))?!: |BREAKING[ -]CHANGE: )'

          bump_level='patch'
          if grep -Eq "${feature_pattern}" <<< "${commit_messages}"; then
            bump_level='minor'
          fi
          if grep -Eq "${breaking_change_pattern}" <<< "${commit_messages}"; then
            bump_level='major'
          fi

          last_version="${LAST_TAG#v}"
          IFS='.' read -r major minor patch <<< "${last_version}"

          case "${bump_level}" in
            major) next_version="$((major + 1)).0.0" ;;
            minor) next_version="${major}.$((minor + 1)).0" ;;
            patch) next_version="${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Version suivante::${last_version} → ${next_version} (montée ${bump_level})."
