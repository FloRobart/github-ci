name: Gitflow

# Reusable workflow: the whole gitflow, described step by step. It holds no logic
# of its own: each step lives in its own file, this one only says when it runs.
#
#   Pull request                         →  branch rules, title, tests
#   Manual button on dev                 →  next version, release branch, pull request
#   Manual button on main                →  patch version, hotfix branch, pull request
#   Manual button on a release or hotfix →  release candidate
#   Merge on main                        →  tag, GitHub Release, final Docker images, back-merge
#
# Only one release or hotfix is in progress at a time, see check-gitflow-branches.yml.
#
# The calling workflow must listen to "pull_request", "push" on main and
# "workflow_dispatch", and pass its secrets with "secrets: inherit". Its job must
# be named "gitflow": the rulesets expect checks named "gitflow / ...".

on:
  workflow_call:
    inputs:
      docker-images:
        description: >-
          JSON list of the Docker images to build. Each image accepts "name" (default:
          the repository name), "context" (default: ".") and "dockerfile" (default: the
          Dockerfile at the root of the context; a given path starts from the root of
          the repository, not from the context).
        type: string
        default: '[{"context": "."}]'
      node-version:
        description: Node.js version used to test Node.js projects.
        type: string
        default: '24'

# Runs on the same branch wait for each other instead of racing: two clicks on the
# button, or two merges on main, are handled one after the other. A pull request
# only keeps its latest run, the older ones are cancelled.
concurrency:
  group: gitflow-${{ github.event_name == 'pull_request' && format('pull-request-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Shared by pull requests and by the manual button
  # ===========================================================================

  detect-project-type:
    name: Project type
    if: github.event_name != 'push'
    uses: ./.github/workflows/detect-project-type.yml

  check-gitflow-branches:
    name: Gitflow branches
    if: github.event_name != 'push'
    uses: ./.github/workflows/check-gitflow-branches.yml

  # ===========================================================================
  # Pull request
  # ===========================================================================

  check-pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/check-pull-request-title.yml

  run-tests:
    name: Tests
    if: github.event_name == 'pull_request'
    needs: detect-project-type
    uses: ./.github/workflows/run-tests.yml
    with:
      project-type: ${{ needs.detect-project-type.outputs.project-type }}
      node-version: ${{ inputs.node-version }}

  # ===========================================================================
  # Manual button on dev (new release) or on main (new hotfix)
  # ===========================================================================

  compute-next-version:
    name: Next version
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: check-gitflow-branches
    uses: ./.github/workflows/compute-next-version.yml
    with:
      hotfix: ${{ github.ref_name == 'main' }}

  create-release-branch:
    name: Release branch
    needs: [detect-project-type, compute-next-version]
    uses: ./.github/workflows/create-release-branch.yml
    secrets: inherit
    with:
      version: ${{ needs.compute-next-version.outputs.version }}
      project-type: ${{ needs.detect-project-type.outputs.project-type }}
      hotfix: ${{ github.ref_name == 'main' }}

  # ===========================================================================
  # Manual button on a release or hotfix branch
  # ===========================================================================

  publish-release-candidate:
    name: Release candidate
    if: >-
      github.event_name == 'workflow_dispatch'
      && (startsWith(github.ref_name, 'release-v') || startsWith(github.ref_name, 'hotfix/v'))
    needs: check-gitflow-branches
    uses: ./.github/workflows/publish-release-candidate.yml
    secrets: inherit
    with:
      release-branch: ${{ github.ref_name }}
      docker-images: ${{ inputs.docker-images }}

  # ===========================================================================
  # Merge on main
  # ===========================================================================

  publish-release:
    name: Release
    if: github.event_name == 'push' && github.ref_name == 'main'
    uses: ./.github/workflows/publish-release.yml
    secrets: inherit
    with:
      docker-images: ${{ inputs.docker-images }}
