name: Check gitflow branches

# Reusable workflow: the branch rules that keep a project inside the gitflow.
#
#   1. The manual button only works on a branch that has a role in the gitflow:
#      "dev", "main", "release-vX.Y.Z" and "hotfix/vX.Y.Z".
#   2. Only one version is in progress at a time: the button on "dev" or "main" is
#      refused while a release or hotfix branch exists. Two versions opened together
#      would be published in an unpredictable order, and "latest" could go back.
#   3. "main" only accepts pull requests coming from a "release-vX.Y.Z" or a
#      "hotfix/vX.Y.Z" branch.
#   4. That version must be greater than the last published one.
#
# Every other situation is accepted: the job then succeeds without doing anything.

on:
  workflow_call:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  # A release or hotfix branch, for example "release-v1.5.0" or "hotfix/v1.5.1".
  RELEASE_BRANCH_PATTERN: '^(release-|hotfix/)v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      # ---------- Manual button ----------

      - name: Refuse the manual button on a branch without any role in the gitflow
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${CURRENT_BRANCH}" = 'dev' ] || [ "${CURRENT_BRANCH}" = 'main' ]; then
            exit 0
          fi

          if [[ "${CURRENT_BRANCH}" =~ ${RELEASE_BRANCH_PATTERN} ]]; then
            exit 0
          fi

          echo "::error title=Bouton refusé::Le bouton a été lancé depuis « ${CURRENT_BRANCH} ». Il ne fonctionne que sur dev (créer une release), main (créer un hotfix), release-vX.Y.Z et hotfix/vX.Y.Z (publier une release candidate)."
          exit 1

      - name: Refuse a new version while another one is in progress
        if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'dev' || github.ref_name == 'main')
        run: |
          branch_names=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          branches_in_progress=$(grep -E "${RELEASE_BRANCH_PATTERN}" <<< "${branch_names}" | paste --serial --delimiters=' ' || true)

          if [ -z "${branches_in_progress}" ]; then
            exit 0
          fi

          echo "::error title=Version déjà en cours::Une seule version à la fois : ${branches_in_progress} est déjà en cours. Mergez sa pull request dans main, ou supprimez la branche pour l'abandonner. Un correctif urgent se pousse directement sur cette branche."
          exit 1

      # ---------- Pull request towards main ----------

      - name: Refuse a pull request towards main that is neither a release nor a hotfix
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "${SOURCE_BRANCH}" =~ ${RELEASE_BRANCH_PATTERN} ]]; then
            exit 0
          fi

          echo "::error title=Pull request refusée::« main » n'accepte que les branches « release-vX.Y.Z » et « hotfix/vX.Y.Z », pas « ${SOURCE_BRANCH} ». Ces branches se créent avec le bouton du workflow, depuis dev (release) ou depuis main (hotfix)."
          exit 1

      - name: Refuse a version that is not greater than the last published one
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          # Keeps what follows the "v": "release-v1.5.0" and "hotfix/v1.5.1" give "1.5.0" and "1.5.1".
          version="${SOURCE_BRANCH##*v}"

          # Tag names without their "refs/tags/v" prefix, for example "1.5.0" or "1.5.0-rc.1".
          tag_versions=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/v")')

          # Release candidates ("1.5.0-rc.1") are left out by the strict pattern.
          last_version=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "${tag_versions}" | sort --version-sort | tail -n 1 || true)

          if [ -z "${last_version}" ]; then
            exit 0
          fi

          highest_version=$(printf '%s\n' "${last_version}" "${version}" | sort --version-sort | tail -n 1)

          if [ "${version}" != "${last_version}" ] && [ "${highest_version}" = "${version}" ]; then
            exit 0
          fi

          echo "::error title=Version dépassée::v${version} n'est pas plus récente que la dernière version publiée, v${last_version}. Fermez cette pull request, supprimez la branche ${SOURCE_BRANCH}, puis relancez le bouton pour obtenir une nouvelle version."
          exit 1
