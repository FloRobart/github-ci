name: Check pull request title

# Reusable workflow: refuses a pull request whose title does not follow
# Conventional Commits (https://www.conventionalcommits.org/).
#
# The title matters because it becomes the commit message once the pull request
# is merged, and the next version is computed from those messages.

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Check that the title follows Conventional Commits
        env:
          # Passed through the environment so a malicious title cannot inject shell commands.
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          allowed_types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          conventional_title_pattern="^(${allowed_types})(\([^()]+\))?!?: [^ ].*$"

          if [[ "${PULL_REQUEST_TITLE}" =~ ${conventional_title_pattern} ]]; then
            echo "✅ Titre valide : ${PULL_REQUEST_TITLE}"
            exit 0
          fi

          {
            echo "### ❌ Titre de pull request invalide"
            echo
            echo "Titre reçu : \`${PULL_REQUEST_TITLE}\`"
            echo
            echo "Format attendu : \`type(portée optionnelle): description\`"
            echo
            echo "Types acceptés : \`${allowed_types//|/, }\`"
            echo
            echo "Exemples :"
            echo "- \`feat: ajoute l'export CSV\` → version mineure"
            echo "- \`fix(auth): corrige l'expiration du jeton\` → version corrective"
            echo "- \`feat(api)!: supprime la route v1\` → version majeure"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error title=Titre de pull request invalide::Le titre doit respecter Conventional Commits, par exemple « feat: ajoute l'export CSV ». Modifiez le titre : la vérification se relance toute seule."
          exit 1
