---
name: Start release

# Button of the Actions tab: prepares a new version from the integration branch.
# Creates the release/x.y.z branch and opens its pull request to production.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Montée de version ("auto" la déduit des titres de pull requests)'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

jobs:
  start:
    name: Start release
    uses: FloRobart/Github-ci/.github/workflows/start-release-or-hotfix.yml@v1
    with:
      kind: release
      bump: ${{ inputs.bump }}
      project-type: node
      automation-app-client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
