---
name: Start hotfix

# Button of the Actions tab: prepares an urgent fix of the version in production.
# Creates the hotfix/x.y.z branch from the production branch, with a patch
# version bump, and opens its pull request to production.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    name: Start hotfix
    uses: FloRobart/Github-ci/.github/workflows/start-release-or-hotfix.yml@v1
    with:
      kind: hotfix
      project-type: node
      automation-app-client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
