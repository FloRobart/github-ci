---
name: Pull request

# Checks every pull request: the Git workflow rules first, then the code.
# The two jobs below are the required status checks of the protected branches:
#   "Policy / Git workflow"  and  "Quality / Checks"
# Renaming a job here means updating the branch rulesets as well.

on:
  pull_request:
    # "edited" re-runs the checks when the title or the target branch changes.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    uses: FloRobart/Github-ci/.github/workflows/pull-request-policy.yml@v1
    with:
      project-type: flutter

  quality:
    name: Quality
    uses: FloRobart/Github-ci/.github/workflows/flutter-quality.yml@v1
