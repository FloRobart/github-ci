---
name: Release

# Runs when a release or hotfix pull request is merged into the production
# branch: publishes the version (tag and GitHub Release), builds and pushes the
# Docker image of the web application, then brings the version back into the
# integration branch.
#
# Nothing is deployed: putting the new image on the server stays manual.
# Publishing to a mobile store would be one more job next to "web-image".

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    uses: FloRobart/github-ci/.github/workflows/publish-release.yml@v1
    with:
      project-type: flutter
      automation-app-client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

  quality:
    name: Quality
    needs: release
    if: ${{ needs.release.outputs.should-publish == 'true' }}
    uses: FloRobart/github-ci/.github/workflows/flutter-quality.yml@v1

  web-image:
    name: Web image
    needs: [release, quality]
    permissions:
      contents: read
      packages: write
    uses: FloRobart/github-ci/.github/workflows/docker-publish.yml@v1
    with:
      image-name: my-app-web # TODO: name of the image, for example "econoris-app-web"
      version: ${{ needs.release.outputs.version }}
      tag-latest: true
      # The Dockerfile copies the whole project before building: no layer can be reused.
      build-cache: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  back-merge:
    name: Back-merge
    needs: release
    if: ${{ needs.release.outputs.should-publish == 'true' }}
    uses: FloRobart/github-ci/.github/workflows/back-merge.yml@v1
    with:
      released-version: ${{ needs.release.outputs.version }}
      project-type: flutter
      automation-app-client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
