---
name: Start release or hotfix

# Reusable workflow: creates the release/x.y.z or hotfix/x.y.z branch, writes
# the new version in the project files and opens the pull request to production.
#
#   release  starts from the integration branch; the version is deduced from
#            the titles of the pull requests merged since the last release.
#   hotfix   starts from the production branch; the version gets a patch bump.
#
# The calling workflow is expected to be triggered by "workflow_dispatch".

on:
  workflow_call:
    inputs:
      kind:
        description: '"release" or "hotfix".'
        type: string
        required: true
      bump:
        description: 'Version bump of a release: "auto" (deduced from pull request titles), "patch", "minor" or "major".'
        type: string
        default: auto
      project-type:
        description: 'How the project stores its version: "node", "flutter" or "extension".'
        type: string
        required: true
      production-branch:
        description: Name of the production branch.
        type: string
        default: main
      integration-branch:
        description: Name of the integration branch.
        type: string
        default: develop
      extension-manifest-path:
        description: Path of the manifest.json, for extension projects only.
        type: string
        default: public/manifest.json
      automation-app-client-id:
        description: Client ID of the automation GitHub App.
        type: string
        default: ''
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        description: Private key of the automation GitHub App.
        required: false
    outputs:
      version:
        description: Version of the started release or hotfix.
        value: ${{ jobs.start.outputs.version }}
      branch:
        description: Name of the created branch.
        value: ${{ jobs.start.outputs.branch }}
      pull-request-url:
        description: URL of the pull request opened to the production branch.
        value: ${{ jobs.start.outputs.pull-request-url }}

permissions:
  contents: read

jobs:
  start:
    name: Start ${{ inputs.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Two starts at the same time would compute the same version.
    concurrency:
      group: start-release-or-hotfix-${{ github.repository }}
      cancel-in-progress: false

    outputs:
      version: ${{ steps.start.outputs.version }}
      branch: ${{ steps.start.outputs.branch }}
      pull-request-url: ${{ steps.start.outputs.pull-request-url }}

    steps:
      # The whole history is needed to compare branches and to find the pull
      # requests merged since the last release. The branch the workflow was
      # started on does not matter: the script always starts from the
      # integration branch (release) or the production branch (hotfix).
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checked out at the exact commit of this reusable workflow, so the
      # scripts can never be out of sync with the workflow that runs them.
      - name: Checkout CI toolkit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-toolkit
          persist-credentials: false

      - name: Authenticate automation
        id: automation
        uses: ./.ci-toolkit/actions/authenticate-automation
        with:
          app-client-id: ${{ inputs.automation-app-client-id }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Create branch and pull request
        id: start
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          FLOW_KIND: ${{ inputs.kind }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          INTEGRATION_BRANCH: ${{ inputs.integration-branch }}
          PROJECT_TYPE: ${{ inputs.project-type }}
          EXTENSION_MANIFEST_PATH: ${{ inputs.extension-manifest-path }}
        run: node .ci-toolkit/toolkit/commands/start-release-or-hotfix.mjs
