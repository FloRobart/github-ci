---
name: Docker publish

# Reusable workflow: builds a Docker image once and pushes it to the GitHub
# Container Registry and to Docker Hub, tagged with the given version.
#
# Published references:
#   ghcr.io/<repository owner>/<image-name>:<version>
#   <Docker Hub user>/<image-name>:<version>
#   and the same with ":latest" when "tag-latest" is true.
#
# The calling job must grant "packages: write" to publish to GHCR.

on:
  workflow_call:
    inputs:
      image-name:
        description: Name of the image, without registry or owner, for example "econoris-server".
        type: string
        required: true
      version:
        description: Version used as image tag, for example "1.4.0" or "1.4.0-rc.2".
        type: string
        required: true
      tag-latest:
        description: Also moves the "latest" tag to this image. Keep it false for release candidates.
        type: boolean
        default: false
      context:
        description: Build context, relative to the root of the repository.
        type: string
        default: .
      dockerfile:
        description: Path of the Dockerfile. Empty uses the Dockerfile at the root of the context.
        type: string
        default: ''
      platforms:
        description: Target platforms, separated by commas.
        type: string
        default: linux/amd64
      build-arguments:
        description: Build arguments, one "NAME=value" per line.
        type: string
        default: ''
      build-cache:
        description: Reuses image layers between runs. Turn it off when the Dockerfile copies the whole project first.
        type: boolean
        default: true
      publish-to-ghcr:
        description: Pushes the image to the GitHub Container Registry.
        type: boolean
        default: true
      publish-to-docker-hub:
        description: Pushes the image to Docker Hub.
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub user name, required when publishing to Docker Hub.
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token, required when publishing to Docker Hub.
        required: false
    outputs:
      digest:
        description: Digest of the pushed image.
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ inputs.image-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check configuration
        id: configuration
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_VERSION: ${{ inputs.version }}
          PUBLISH_TO_GHCR: ${{ inputs.publish-to-ghcr }}
          PUBLISH_TO_DOCKER_HUB: ${{ inputs.publish-to-docker-hub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          fail() {
            echo "::error title=❌ $1::$2"
            printf '### ❌ %s\n\n%s\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

          docker_tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'

          if [[ ! "${IMAGE_VERSION}" =~ ${docker_tag_pattern} ]]; then
            fail "Version de l'image invalide" "Valeur reçue pour « version » : « ${IMAGE_VERSION} ». Elle doit être fournie par l'étape qui crée la release (sortie « version ») et ressembler à 1.4.0 ou 1.4.0-rc.2."
          fi

          if [ "${PUBLISH_TO_GHCR}" != "true" ] && [ "${PUBLISH_TO_DOCKER_HUB}" != "true" ]; then
            fail "Aucun registre sélectionné" "Les paramètres « publish-to-ghcr » et « publish-to-docker-hub » sont tous les deux à false. Activez au moins un registre."
          fi

          if [ "${PUBLISH_TO_DOCKER_HUB}" = "true" ] && { [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; }; then
            fail "Identifiants Docker Hub manquants" "Les secrets DOCKERHUB_USERNAME et DOCKERHUB_TOKEN doivent être définis dans ce dépôt (Settings → Secrets and variables → Actions) et transmis au workflow réutilisable. Pour ne publier que sur GHCR, passez « publish-to-docker-hub » à false."
          fi

          # Registries refuse image names containing upper-case letters.
          {
            echo "images<<IMAGES_END"
            if [ "${PUBLISH_TO_GHCR}" = "true" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
            fi
            if [ "${PUBLISH_TO_DOCKER_HUB}" = "true" ]; then
              echo "${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            fi
            echo "IMAGES_END"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish-to-ghcr }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: ${{ inputs.publish-to-docker-hub }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "latest" is only moved on request, never deduced from the version.
      - name: Compute image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.configuration.outputs.images }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.tag-latest }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-arguments }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: ${{ inputs.build-cache && format('type=gha,scope={0}', inputs.image-name) || '' }}
          cache-to: ${{ inputs.build-cache && format('type=gha,mode=max,scope={0}', inputs.image-name) || '' }}

      - name: Report published image
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_VERSION: ${{ inputs.version }}
          IMAGE_REFERENCES: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          title="✅ Image ${IMAGE_NAME} ${IMAGE_VERSION} publiée"

          {
            echo "### ${title}"
            echo
            while IFS= read -r image_reference; do
              echo "- \`${image_reference}\`"
            done <<< "${IMAGE_REFERENCES}"
            echo
            echo "Digest : \`${IMAGE_DIGEST}\`"
            echo
            echo "La mise en production sur le serveur reste manuelle."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::notice title=${title}::Image poussée sur les registres configurés. Le détail des références est dans le résumé du workflow."

      - name: Report failure
        if: ${{ failure() && steps.configuration.conclusion == 'success' }}
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          title="❌ Publication de l'image ${IMAGE_NAME} ${IMAGE_VERSION} échouée"
          message="L'étape marquée d'une croix rouge ci-dessus contient le détail. Causes fréquentes : identifiants Docker Hub expirés (étape Log in to Docker Hub), permission « packages: write » absente du job appelant (étape Log in to GitHub Container Registry), erreur dans le Dockerfile (étape Build and push image). Une fois corrigé, relancez uniquement ce job avec « Re-run failed jobs »."

          echo "::error title=${title}::${message}"
          printf '### %s\n\n%s\n' "${title}" "${message}" >> "${GITHUB_STEP_SUMMARY}"
