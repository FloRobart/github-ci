---
name: Pull request policy

# Reusable workflow: enforces the Git workflow on a pull request.
#   1. The title follows the Conventional Commits format.
#   2. The production branch only receives release/x.y.z and hotfix/x.y.z branches.
#   3. A pull request into production carries a version that can be published.
#
# The calling workflow must be triggered by "pull_request".

on:
  workflow_call:
    inputs:
      project-type:
        description: 'How the project stores its version: "node", "flutter" or "extension".'
        type: string
        required: true
      production-branch:
        description: Name of the production branch.
        type: string
        default: main
      extension-manifest-path:
        description: Path of the manifest.json, for extension projects only.
        type: string
        default: public/manifest.json
      allowed-types:
        description: Accepted title types, separated by commas or spaces. Empty keeps the standard list.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  git-workflow:
    name: Git workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      # Checked out at the exact commit of this reusable workflow, so the
      # scripts can never be out of sync with the workflow that runs them.
      - name: Checkout CI toolkit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-toolkit
          persist-credentials: false

      - name: Validate pull request title
        uses: ./.ci-toolkit/actions/validate-pull-request-title
        with:
          title: ${{ github.event.pull_request.title }}
          allowed-types: ${{ inputs.allowed-types }}

      # "!cancelled()" keeps the next checks running after a failure, so every
      # problem of the pull request is reported in a single run.
      - name: Validate source and target branches
        if: ${{ !cancelled() }}
        uses: ./.ci-toolkit/actions/validate-branch-policy
        with:
          source-branch: ${{ github.event.pull_request.head.ref }}
          target-branch: ${{ github.event.pull_request.base.ref }}
          production-branch: ${{ inputs.production-branch }}
          is-from-fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Validate version to publish
        if: ${{ !cancelled() && github.event.pull_request.base.ref == inputs.production-branch }}
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PROJECT_TYPE: ${{ inputs.project-type }}
          EXTENSION_MANIFEST_PATH: ${{ inputs.extension-manifest-path }}
        run: node .ci-toolkit/toolkit/commands/validate-release-pull-request.mjs
