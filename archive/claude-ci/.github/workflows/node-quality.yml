---
name: Node quality

# Reusable workflow: installs a Node.js project and runs its build, lint and
# tests. Each command can be replaced, or skipped by passing an empty string.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install.
        type: string
        default: '24'
      working-directory:
        description: Directory of the project, relative to the root of the repository.
        type: string
        default: .
      install-command:
        description: Command that installs the dependencies.
        type: string
        default: npm ci
      build-command:
        description: Command that builds the project. Empty skips the build.
        type: string
        default: ''
      lint-command:
        description: Command that lints the project. It runs after the build. Empty skips the lint.
        type: string
        default: ''
      test-command:
        description: Command that runs the tests. Empty skips the tests.
        type: string
        default: npm test

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        run: ${{ inputs.lint-command }}

      - name: Test
        if: ${{ inputs.test-command != '' }}
        env:
          CI: 'true'
        run: ${{ inputs.test-command }}

      - name: Report success
        run: |
          title="✅ Vérifications Node.js réussies"

          echo "::notice title=${title}::Installation, build, lint et tests configurés pour ce projet : tout est passé."
          printf '### %s\n\nInstallation, build, lint et tests configurés pour ce projet : tout est passé.\n' "${title}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report failure
        if: ${{ failure() }}
        run: |
          title="❌ Vérifications Node.js en échec"
          message="L'étape marquée d'une croix rouge ci-dessus (Install dependencies, Build, Lint ou Test) contient le détail de l'erreur. Corrigez puis poussez un nouveau commit : les vérifications se relancent toutes seules."

          echo "::error title=${title}::${message}"
          printf '### %s\n\n%s\n' "${title}" "${message}" >> "${GITHUB_STEP_SUMMARY}"
