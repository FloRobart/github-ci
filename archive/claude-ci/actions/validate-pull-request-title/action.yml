name: Validate pull request title
description: >
  Fails when a pull request title does not follow the Conventional Commits
  format, with a message explaining what is wrong and how to fix it.

inputs:
  title:
    description: Pull request title to check.
    required: true
  allowed-types:
    description: Accepted types, separated by commas or spaces. Leave empty to use the standard list.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate pull request title
      shell: bash
      env:
        PULL_REQUEST_TITLE: ${{ inputs.title }}
        ALLOWED_TYPES: ${{ inputs.allowed-types }}
      run: node "${GITHUB_ACTION_PATH}/../../toolkit/commands/validate-pull-request-title.mjs"
