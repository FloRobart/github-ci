name: Validate branch policy
description: >
  Fails when a pull request targets the production branch from anything other
  than a release/x.y.z or hotfix/x.y.z branch of the repository.

inputs:
  source-branch:
    description: Branch the pull request comes from.
    required: true
  target-branch:
    description: Branch the pull request goes into.
    required: true
  production-branch:
    description: Name of the production branch.
    required: false
    default: main
  is-from-fork:
    description: '"true" when the source branch belongs to a fork.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate source and target branches
      shell: bash
      env:
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        PRODUCTION_BRANCH: ${{ inputs.production-branch }}
        IS_FROM_FORK: ${{ inputs.is-from-fork }}
      run: node "${GITHUB_ACTION_PATH}/../../toolkit/commands/validate-branch-policy.mjs"
