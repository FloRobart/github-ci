name: Astro

# Reusable workflow (owner: astro/): the CI of an Astro website, gitflow included.
#
#   Pull request           →  gitflow checks + quality (lint, astro check, tests, build)
#   Button (Run workflow)  →  quality, then release candidate: Docker image + GitHub pre-release
#   Merge on main          →  quality, then final version: Docker image + GitHub Release
#
# Only the quality job is specific to Astro: every gitflow step comes from the
# gitflow-*.yml workflows. Unlike a Node.js API, the site is also built during the
# quality job: "astro build" finds errors that "astro check" does not (broken
# content collections, failing pages). See astro/README.md for the project requirements.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the quality job.
        type: string
        default: '24'

# One run at a time per branch: two clicks on the button, or two merges on main, wait
# for each other. A pull request only keeps its latest run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  #=========#
  # Quality #
  #=========#

  gitflow-checks:
    name: Gitflow
    if: github.event_name == 'pull_request'
    uses: FloRobart/Github-ci/.github/workflows/gitflow-checks.yml@main

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # "npm ci" installs exactly the versions of package-lock.json.
      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the types (astro check)
        run: npm run typecheck

      - name: Run the tests
        run: npm test

      - name: Build the site
        run: npm run build

  #=========#
  # Release #
  #=========#

  prepare-release:
    name: Prepare release
    if: github.event_name != 'pull_request'
    needs: quality
    uses: FloRobart/Github-ci/.github/workflows/gitflow-prepare-release.yml@main

  docker-image:
    name: Docker image
    needs: prepare-release
    uses: FloRobart/Github-ci/.github/workflows/gitflow-docker-image.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ needs.prepare-release.outputs.project-name }}
      image-tag: ${{ needs.prepare-release.outputs.version }}
      tag-latest: ${{ needs.prepare-release.outputs.kind == 'final' }}

  publish-release:
    name: Publish release
    needs: [prepare-release, docker-image]
    uses: FloRobart/Github-ci/.github/workflows/gitflow-publish-release.yml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      kind: ${{ needs.prepare-release.outputs.kind }}
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      previous-tag: ${{ needs.prepare-release.outputs.previous-tag }}
      new-release-branch: ${{ needs.prepare-release.outputs.new-release-branch }}
