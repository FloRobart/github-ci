name: Flutter

# Reusable workflow (owner: flutter/): the CI of a Flutter project, gitflow included.
#
#   Pull request           →  gitflow checks + quality (format, analyze, tests, build)
#   Button (Run workflow)  →  quality, then release candidate: builds + GitHub pre-release
#   Merge on main          →  quality, then final version: builds + GitHub Release + stores
#
# The builds depend on the project kind (gitflow/scripts/detect-project.sh):
#
#   Application  →  web Docker image, when there is a Dockerfile
#                   Android, without the signing secrets: APK signed with the debug key,
#                   attached to the release
#                   Android, with the signing secrets: signed APK and AAB attached to the
#                   release, then the AAB sent to Google Play (final version only)
#   Library      →  git tag and GitHub Release, then pub.dev (final version only)
#
# The Android release is built like F-Droid's build server rebuilds it, so that F-Droid can
# publish the signed APK of the GitHub Release itself: F-Droid follows the tags on its own,
# nothing is uploaded to it. F_DROID_ENABLE=true requires the release key and checks that
# F-Droid rebuilds the same APK (flutter/README.md → F-Droid).
#
# The quality job ends by building an application the way its release does, without
# publishing anything, so a broken build is seen in the pull request rather than at
# release time: the Android APK (debug build, no signing needed) when "android" is on,
# and the Docker image when "docker-image" is on and there is a Dockerfile. A library
# has nothing to build: "flutter analyze" already compiles all its code.
#
# Google Play and pub.dev come after the GitHub Release, like the stores of extension.yml:
# a refused version leaves the tag and the back-merge untouched, and each one is skipped
# while its secret is missing.
#
# Only the quality, Android, Google Play and pub.dev jobs are specific to Flutter: every
# gitflow step comes from the gitflow-*.yml workflows. See flutter/README.md for the
# project requirements.
#
# Every job installs the Flutter version told by gitflow/scripts/resolve-flutter-version.sh:
# the "flutter-version" input, or else the exact version of environment.flutter in
# pubspec.yaml, or else the latest stable version with a warning.
#
# Optional secrets, passed with "secrets: inherit":
#
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD               →  signed Android build
#   F_DROID_ENABLE ("true" or "false")                    →  F-Droid: release key required,
#                                                            and the APK checked as F-Droid
#                                                            rebuilds it
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON                      →  Google Play: release key required
#   PUB_DEV_SERVICE_ACCOUNT_JSON                          →  pub.dev
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN                   →  Docker Hub, and the login to dhi.io
#                                                            required by a Dockerfile based on
#                                                            a Docker Hardened Image

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter version, for example "3.35.0". Empty means the exact version (X.Y.Z) of environment.flutter in pubspec.yaml, or else the latest stable version with a warning.
        type: string
        default: ''
      docker-image:
        description: Publishes the web version of an application as a Docker image, when it has a Dockerfile at its root.
        type: boolean
        default: true
      android:
        description: Builds the Android version of an application and attaches it to the release.
        type: boolean
        default: true
      google-play-track:
        description: Google Play track receiving a final version, for example "production", "beta", "alpha" or "internal".
        type: string
        default: production

# One run at a time per branch: two clicks on the button, or two merges on main, wait
# for each other. A pull request only keeps its latest run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  #=========#
  # Quality #
  #=========#

  gitflow-checks:
    name: Gitflow
    if: github.event_name == 'pull_request'
    uses: FloRobart/github-ci/.github/workflows/gitflow-checks.yml@main

  quality:
    name: Quality
    runs-on: ubuntu-latest
    # The Android build and the Docker image of an application can take a while.
    timeout-minutes: 30

    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the gitflow scripts
        uses: FloRobart/github-ci/gitflow/scripts@main

      - name: Resolve the Flutter version
        id: flutter-version
        env:
          REQUESTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        run: resolve-flutter-version.sh "${REQUESTED_FLUTTER_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # The lockfile is only enforced with a pinned Flutter: a new stable release changes the
      # versions imposed by the SDK, which would break a project without any commit. The
      # lockfile of example/ does not matter: only the one of the project is enforced.
      - name: Install the dependencies
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.version }}
        run: |
          if [ -z "${FLUTTER_VERSION}" ]; then
            flutter pub get
            exit 0
          fi

          flutter pub get --enforce-lockfile --no-example

          if [ -f example/pubspec.yaml ]; then
            flutter pub get --directory=example
          fi

      - name: Check the formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run the tests
        run: flutter test

      # The project kind tells what the release builds, so what must be built here.
      - name: Detect the project
        id: project
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          project_name=$(to-image-name.sh "${REPOSITORY_NAME}")
          detect-project.sh "${project_name}" >> "${GITHUB_OUTPUT}"

      # A debug build needs no signing secret, so it also runs on the pull requests of a
      # fork. The release build itself is made by the android job.
      - name: Set up Java
        if: inputs.android && steps.project.outputs.kind == 'application'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the Android application
        if: inputs.android && steps.project.outputs.kind == 'application'
        run: flutter build apk --debug

      - name: Set up Docker Buildx
        if: >-
          inputs.docker-image
          && steps.project.outputs.kind == 'application'
          && steps.project.outputs.has-dockerfile == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Docker Hardened Images: dhi.io refuses anonymous pulls and uses the Docker Hub
      # account. Without the secrets (pull request of a fork, Dependabot without its own
      # copy of them), only a Dockerfile based on dhi.io fails to build.
      - name: Log in to Docker Hardened Images
        if: >-
          env.DOCKERHUB_ENABLED == 'true'
          && inputs.docker-image
          && steps.project.outputs.kind == 'application'
          && steps.project.outputs.has-dockerfile == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same build as gitflow-docker-image.yml, but nothing is pushed. The cache it
      # leaves speeds up the build of the release.
      - name: Build the Docker image
        if: >-
          inputs.docker-image
          && steps.project.outputs.kind == 'application'
          && steps.project.outputs.has-dockerfile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #=========#
  # Release #
  #=========#

  prepare-release:
    name: Prepare release
    if: github.event_name != 'pull_request'
    needs: quality
    uses: FloRobart/github-ci/.github/workflows/gitflow-prepare-release.yml@main
    with:
      project-type: flutter

  docker-image:
    name: Docker image
    if: >-
      inputs.docker-image
      && needs.prepare-release.outputs.project-kind == 'application'
      && needs.prepare-release.outputs.has-dockerfile == 'true'
    needs: prepare-release
    uses: FloRobart/github-ci/.github/workflows/gitflow-docker-image.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ needs.prepare-release.outputs.project-name }}
      image-tag: ${{ needs.prepare-release.outputs.version }}
      tag-latest: ${{ needs.prepare-release.outputs.kind == 'final' }}

  # Built in the container of F-Droid's build server, in the folder where F-Droid builds the
  # application: F-Droid rebuilds each version from its tag, and publishes the APK of the
  # GitHub Release only when both are identical, the signature apart. A Flutter build
  # depends on its folder (written in libapp.so) and on its Java version.
  android:
    name: Android
    if: inputs.android && needs.prepare-release.outputs.project-kind == 'application'
    needs: prepare-release
    runs-on: ubuntu-latest
    # Nothing is cached, like on F-Droid's build server: Flutter, the NDK and the Gradle
    # dependencies are downloaded at every release.
    timeout-minutes: 45

    # The moving tag, on purpose: F-Droid builds with its current image, and GitLab deletes
    # the old digests of the tag. A pinned digest would drift away from F-Droid, then stop
    # resolving.
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie

    outputs:
      signed: ${{ steps.publications.outputs.signed }}

    env:
      KIND: ${{ needs.prepare-release.outputs.kind }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_FILE_NAME: ${{ needs.prepare-release.outputs.project-name }}-${{ needs.prepare-release.outputs.tag }}
      # Folder of F-Droid's build server that holds the Flutter SDK and the applications.
      FDROID_BUILD_ROOT: /home/vagrant/build

    steps:
      # The secrets tell where the application goes, before anything is downloaded:
      #
      #   no store             →  GitHub Release, signed with the release key when it exists,
      #                            with the debug key otherwise
      #   F_DROID_ENABLE=true  →  GitHub Release, which F-Droid publishes: release key required
      #   Google Play secret   →  GitHub Release, then Google Play: release key required
      #
      # A store without the release key stops the run here: nothing is published.
      - name: Plan the Android publications
        id: publications
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          F_DROID_ENABLE: ${{ secrets.F_DROID_ENABLE }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          readonly SIGNING_SECRETS='ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD'

          signed=false
          if [ -n "${ANDROID_KEYSTORE_BASE64}${ANDROID_KEYSTORE_PASSWORD}${ANDROID_KEY_ALIAS}${ANDROID_KEY_PASSWORD}" ]; then
            signed=true
          fi

          if [ "${signed}" = 'true' ] && { [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; }; then
            echo "::error title=Signature Android incomplète::Les secrets ${SIGNING_SECRETS} vont ensemble : définissez-les tous, ou aucun."
            exit 1
          fi

          case "${F_DROID_ENABLE}" in
            true) fdroid=true ;;
            '' | false) fdroid=false ;;
            *)
              echo "::error title=F_DROID_ENABLE invalide::Le secret F_DROID_ENABLE vaut « ${F_DROID_ENABLE} » : il doit valoir true ou false."
              exit 1
              ;;
          esac

          google_play=false
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            google_play=true
          fi

          if [ "${fdroid}" = 'true' ] && [ "${signed}" != 'true' ]; then
            echo "::error title=Clé de signature manquante pour F-Droid::Le secret F_DROID_ENABLE vaut true, mais la clé de signature manque : F-Droid refuse un APK signé avec la clé de debug. Définissez les secrets ${SIGNING_SECRETS}, ou passez F_DROID_ENABLE à false."
            exit 1
          fi

          if [ "${google_play}" = 'true' ] && [ "${signed}" != 'true' ]; then
            echo "::error title=Clé de signature manquante pour Google Play::Le secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON existe, mais la clé de signature manque : Google Play refuse un AAB signé avec la clé de debug. Définissez les secrets ${SIGNING_SECRETS}, ou supprimez GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi

          if [ "${signed}" != 'true' ]; then
            echo "::notice title=Android non signé::Aucune clé de signature ni aucun store : l'APK attaché à la release est signé avec la clé de debug."
          fi

          {
            echo "signed=${signed}"
            echo "fdroid=${fdroid}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the gitflow scripts
        uses: FloRobart/github-ci/gitflow/scripts@main

      - name: Resolve the Flutter version
        id: flutter-version
        env:
          REQUESTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        run: resolve-flutter-version.sh "${REQUESTED_FLUTTER_VERSION}" >> "${GITHUB_OUTPUT}"

      # F-Droid builds an application in <build root>/<applicationId>, with its pub cache
      # inside. The image declares its Android SDK in /etc/profile.d/bsenv.sh, which only a
      # login shell reads: the next steps get it from here.
      - name: Prepare the F-Droid build folder
        env:
          FDROID: ${{ steps.publications.outputs.fdroid }}
        run: |
          build_directory="${GITHUB_WORKSPACE}"
          application_id=$(read-android-application-id.sh)

          if [ "${FDROID}" = 'true' ] && [ -z "${application_id}" ]; then
            echo "::error title=applicationId introuvable pour F-Droid::F_DROID_ENABLE vaut true, mais l'applicationId n'est pas écrit une seule fois en toutes lettres dans android/app/build.gradle(.kts) : impossible de construire dans le dossier de F-Droid."
            exit 1
          fi

          if [ -n "${application_id}" ]; then
            build_directory="${FDROID_BUILD_ROOT}/${application_id}"
            mkdir -p "${build_directory}"
            cp -a . "${build_directory}/"
          fi

          source /etc/profile.d/bsenv.sh

          {
            echo "BUILD_DIRECTORY=${build_directory}"
            echo "PUB_CACHE=${build_directory}/.pub-cache"
            echo "ANDROID_HOME=${ANDROID_HOME}"
          } >> "${GITHUB_ENV}"

      # Cloned where F-Droid puts its Flutter source library, at the same version.
      - name: Set up Flutter
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.version }}
        run: |
          flutter_directory="${FDROID_BUILD_ROOT}/srclib/flutter"
          git clone --quiet --depth 1 --branch "${FLUTTER_VERSION:-stable}" https://github.com/flutter/flutter.git "${flutter_directory}"
          echo "${flutter_directory}/bin" >> "${GITHUB_PATH}"

          "${flutter_directory}/bin/flutter" config --no-analytics
          "${flutter_directory}/bin/flutter" --version

      # A final version is built exactly as F-Droid rebuilds its tag: its versionName and
      # versionCode come from the committed pubspec.yaml, checked by its pull request. A
      # release candidate is built before its version commit, so it gets them as options:
      # "X.Y.Z", without the "-rc.N" that stores refuse, and the versionCode of "X.Y.Z".
      # With a pinned Flutter, the lockfile is enforced, as in the quality job and in
      # F-Droid's recipe. The options are shared by the build and by the F-Droid check.
      - name: Choose the build options
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.version }}
        run: |
          build_options='--release'
          if [ "${KIND}" = 'candidate' ]; then
            build_name="${VERSION%%-*}"
            build_number=$(compute-android-version-code.sh "${build_name}")
            build_options="${build_options} --build-name=${build_name} --build-number=${build_number}"
          fi

          pub_get_options=''
          if [ -n "${FLUTTER_VERSION}" ]; then
            pub_get_options='--enforce-lockfile'
          fi

          {
            echo "BUILD_OPTIONS=${build_options}"
            echo "PUB_GET_OPTIONS=${pub_get_options}"
          } >> "${GITHUB_ENV}"

      # Writes the files read by android/app/build.gradle(.kts), as described in the Flutter
      # documentation ("Sign the app"). Without them, Flutter signs the release with the
      # debug key: the APK installs, but neither Google Play nor F-Droid accept it.
      - name: Configure the Android signing
        if: steps.publications.outputs.signed == 'true'
        working-directory: ${{ env.BUILD_DIRECTORY }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release-keystore.jks

          cat > android/key.properties <<END_OF_PROPERTIES
          storeFile=release-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          END_OF_PROPERTIES

      - name: Build the release files
        working-directory: ${{ env.BUILD_DIRECTORY }}
        env:
          SIGNED: ${{ steps.publications.outputs.signed }}
        run: |
          read -r -a build_options <<< "${BUILD_OPTIONS}"
          read -r -a pub_get_options <<< "${PUB_GET_OPTIONS}"
          flutter pub get "${pub_get_options[@]}"

          release_assets_directory="${GITHUB_WORKSPACE}/release-assets"
          mkdir "${release_assets_directory}"

          flutter build apk "${build_options[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "${release_assets_directory}/${RELEASE_FILE_NAME}.apk"

          # The AAB only serves Google Play, which refuses one signed with the debug key.
          if [ "${SIGNED}" != 'true' ]; then
            exit 0
          fi

          flutter build appbundle "${build_options[@]}"
          cp build/app/outputs/bundle/release/app-release.aab "${release_assets_directory}/${RELEASE_FILE_NAME}.aab"

      # The SHA-256 of the signing certificate is the value of AllowedAPKSigningKeys in the
      # F-Droid metadata. An APK still signed with the debug key despite the secrets means
      # that the Gradle file does not read android/key.properties.
      - name: Check the signature
        if: steps.publications.outputs.signed == 'true'
        run: |
          certificates=$(apksigner verify --print-certs "release-assets/${RELEASE_FILE_NAME}.apk")

          if grep --quiet 'certificate DN: .*CN=Android Debug' <<< "${certificates}"; then
            echo "::error title=APK signé avec la clé de debug::Les secrets de signature existent, mais android/app/build.gradle(.kts) ne lit pas android/key.properties : voir flutter/README.md → Signature."
            exit 1
          fi

          certificate_digest=$(sed --quiet 's/^Signer #1 certificate SHA-256 digest: //p' <<< "${certificates}")

          {
            echo '### 🔏 Signature Android'
            echo
            echo "Empreinte SHA-256 du certificat, la valeur de \`AllowedAPKSigningKeys\` pour F-Droid : \`${certificate_digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Rebuilds the application as F-Droid will, from a fresh copy and without the release
      # key, then copies the signature of the release APK onto it, as "fdroid publish" does
      # (apksigcopier). A failure means that F-Droid would refuse this version: nothing is
      # published, rather than a GitHub Release missing from F-Droid.
      - name: Check that F-Droid rebuilds the same APK
        if: steps.publications.outputs.fdroid == 'true'
        run: |
          apt-get update --quiet=2
          apt-get install --yes --quiet=2 apksigcopier > /dev/null

          rm -rf "${BUILD_DIRECTORY}"
          mkdir -p "${BUILD_DIRECTORY}"
          tar --create --exclude=./release-assets --file=- . | tar --extract --file=- --directory="${BUILD_DIRECTORY}"

          read -r -a build_options <<< "${BUILD_OPTIONS}"
          read -r -a pub_get_options <<< "${PUB_GET_OPTIONS}"
          (
            cd "${BUILD_DIRECTORY}"
            flutter pub get "${pub_get_options[@]}"
            flutter build apk "${build_options[@]}"
          )

          if ! apksigcopier compare "release-assets/${RELEASE_FILE_NAME}.apk" "${BUILD_DIRECTORY}/build/app/outputs/flutter-apk/app-release.apk"; then
            echo "::error title=APK non reproductible::F-Droid ne reconstruirait pas le même APK : il refuserait cette version. Voir flutter/README.md → Environnement de build."
            exit 1
          fi

          {
            echo '### 🤖 F-Droid'
            echo
            echo "APK reproductible : F-Droid publiera \`${RELEASE_FILE_NAME}.apk\` après son prochain passage, si l'application y est inscrite."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Picked up by gitflow-publish-release.yml and attached to the release, then by the
      # Google Play job.
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish release
    # The Docker image and the Android build can each be skipped (turned off, mobile
    # application, library): a skipped job is fine, a failed one stops the release.
    if: ${{ !failure() && !cancelled() && needs.prepare-release.result == 'success' }}
    needs: [prepare-release, docker-image, android]
    uses: FloRobart/github-ci/.github/workflows/gitflow-publish-release.yml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      kind: ${{ needs.prepare-release.outputs.kind }}
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      previous-tag: ${{ needs.prepare-release.outputs.previous-tag }}
      new-release-branch: ${{ needs.prepare-release.outputs.new-release-branch }}
      release-assets: ${{ needs.android.result == 'success' }}

  #========#
  # Stores #
  #========#

  # Only a final version goes further than GitHub: a release candidate must never reach
  # the users. The conditions name every needed job, because a skipped job earlier in the
  # chain (Docker image, Android) would otherwise skip these jobs too.

  google-play:
    name: Google Play
    if: >-
      ${{ !cancelled()
      && needs.publish-release.result == 'success'
      && needs.android.result == 'success'
      && needs.prepare-release.outputs.kind == 'final' }}
    needs: [prepare-release, android, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_FILE_NAME: ${{ needs.prepare-release.outputs.project-name }}-${{ needs.prepare-release.outputs.tag }}

    steps:
      # The android job already stopped the run when this secret exists without the release
      # key: an AAB is always signed here.
      - name: Check the Google Play secrets
        id: secrets
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${SERVICE_ACCOUNT_JSON}" ]; then
            echo "::notice title=Google Play ignoré::Le secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON n'existe pas : l'application n'est pas envoyée sur Google Play."
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo 'configured=true' >> "${GITHUB_OUTPUT}"

      - name: Download the release files
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Read in the built APK rather than in the Gradle files, which can set the
      # applicationId in many ways (flavors, variables): the APK holds the final one.
      # aapt2 comes with the Android SDK of the GitHub runners.
      - name: Read the package name
        id: package
        if: steps.secrets.outputs.configured == 'true'
        run: |
          aapt2_path=$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f | sort --version-sort | tail -n 1)

          if [ -z "${aapt2_path}" ]; then
            echo "::error title=aapt2 introuvable::Aucun aapt2 dans ${ANDROID_HOME}/build-tools : impossible de lire le nom de paquet de l'application."
            exit 1
          fi

          package_name=$("${aapt2_path}" dump packagename "release-assets/${RELEASE_FILE_NAME}.apk")
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"

      - name: Send the application to Google Play
        if: steps.secrets.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.package.outputs.name }}
          releaseFiles: release-assets/${{ env.RELEASE_FILE_NAME }}.aab
          releaseName: ${{ needs.prepare-release.outputs.tag }}
          track: ${{ inputs.google-play-track }}
          status: completed

      - name: Report the Google Play release
        if: steps.secrets.outputs.configured == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          TRACK: ${{ inputs.google-play-track }}
        run: |
          {
            echo '### 🤖 Google Play'
            echo
            echo "\`${RELEASE_FILE_NAME}.aab\` (${PACKAGE_NAME}) envoyé sur la piste \`${TRACK}\` : visible des utilisateurs après la validation de Google."
          } >> "${GITHUB_STEP_SUMMARY}"

  pub-dev:
    name: pub.dev
    if: >-
      ${{ !cancelled()
      && needs.publish-release.result == 'success'
      && needs.prepare-release.outputs.kind == 'final'
      && needs.prepare-release.outputs.project-kind == 'library' }}
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      # The code of a private repository must not end up on the public registry: when in
      # doubt (visibility unknown), the library stays off pub.dev.
      REPOSITORY_IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}

    steps:
      - name: Checkout the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every skipped case is a notice, not an error: the library is already published on
      # GitHub. A version already on pub.dev is kept, so a failed run can simply be re-run.
      - name: Check the pub.dev publication
        id: publication
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PUB_DEV_SERVICE_ACCOUNT_JSON }}
        run: |
          skip_publication() {
            echo "::notice title=pub.dev ignoré::$1"
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if [ -z "${SERVICE_ACCOUNT_JSON}" ]; then
            skip_publication "Le secret PUB_DEV_SERVICE_ACCOUNT_JSON n'existe pas : la librairie n'est publiée que sur GitHub."
          fi

          if [ "${REPOSITORY_IS_PUBLIC}" != 'true' ]; then
            skip_publication "Le dépôt n'est pas public : la librairie n'est publiée que sur GitHub."
          fi

          if grep --quiet --extended-regexp "^publish_to:[[:space:]]*['\"]?none" pubspec.yaml; then
            skip_publication "Le pubspec.yaml contient « publish_to: none » : la librairie n'est publiée que sur GitHub."
          fi

          package_name=$(sed --quiet --regexp-extended 's/^name:[[:space:]]*([a-z0-9_]+).*/\1/p' pubspec.yaml)

          if curl --silent --fail --output /dev/null "https://pub.dev/api/packages/${package_name}/versions/${VERSION}"; then
            skip_publication "${package_name} ${VERSION} existe déjà sur pub.dev, elle est conservée."
          fi

          echo "PACKAGE_NAME=${package_name}" >> "${GITHUB_ENV}"
          echo 'configured=true' >> "${GITHUB_OUTPUT}"

      - name: Load the gitflow scripts
        if: steps.publication.outputs.configured == 'true'
        uses: FloRobart/github-ci/gitflow/scripts@main

      - name: Resolve the Flutter version
        id: flutter-version
        if: steps.publication.outputs.configured == 'true'
        env:
          REQUESTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        run: resolve-flutter-version.sh "${REQUESTED_FLUTTER_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Flutter
        if: steps.publication.outputs.configured == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # pub.dev publishes the version written in pubspec.yaml. The committed file already
      # carries it (written on the release branch), with a possible "+N" build number that
      # pub.dev does not need: the copy published here gets the bare version.
      - name: Set the version in pubspec.yaml
        if: steps.publication.outputs.configured == 'true'
        run: |
          if grep --quiet '^version:' pubspec.yaml; then
            sed --in-place --regexp-extended "s/^version:.*/version: ${VERSION}/" pubspec.yaml
            exit 0
          fi

          echo "version: ${VERSION}" >> pubspec.yaml

      # pub.dev only accepts the identity token of GitHub Actions on a tag push, while the
      # CI publishes from a push on main: it signs in with a Google Cloud service account
      # instead, the other method documented by pub.dev. No credentials file is written:
      # it would land in the project directory, and so in the published package.
      - name: Get a pub.dev token
        id: google-cloud
        if: steps.publication.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.PUB_DEV_SERVICE_ACCOUNT_JSON }}
          token_format: id_token
          id_token_audience: https://pub.dev
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      # "--env-var" makes pub read the token from the environment: it is never written to
      # disk. "--force" skips the confirmation, and the warnings such as the modified
      # pubspec.yaml; errors still stop the publication.
      - name: Publish on pub.dev
        if: steps.publication.outputs.configured == 'true'
        env:
          PUB_TOKEN: ${{ steps.google-cloud.outputs.id_token }}
        run: |
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          flutter pub publish --force

          {
            echo '### 🎯 pub.dev'
            echo
            echo "\`${PACKAGE_NAME} ${VERSION}\` publié : https://pub.dev/packages/${PACKAGE_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
