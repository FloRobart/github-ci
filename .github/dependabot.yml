version: 2

updates:
  # Third-party actions of the reusable workflows, pinned by SHA
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    # Wait before adopting a new release, to limit the risk of compromised actions
    cooldown:
      default-days: 7
    # One pull request for all the minor and patch updates. Every major update gets its own
    # pull request, so that a breaking one does not block the others
    groups:
      github-actions-minor-and-patch-updates:
        update-types:
          - "minor"
          - "patch"
